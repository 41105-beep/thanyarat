<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYUTTHAYA | กรุงศรีอยุธยา</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Tahoma","Arial",sans-serif;
    background:#1d120c;
    color:#fff;
    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.hero{

    position:relative;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    overflow:hidden;

    background:
        linear-gradient(
            rgba(25,12,6,.35),
            rgba(25,12,6,.88)
        ),
        url("images/Ayutthaya_Historical_Park_1.jpg")
        center/cover no-repeat;

    animation:
        backgroundMove 18s ease-in-out infinite alternate;
}


/* ภาพพื้นหลังซูมเข้าออกเบา ๆ */

@keyframes backgroundMove{

    0%{
        background-size:100%;
    }

    100%{
        background-size:108%;
    }

}


/* =========================
   DARK OVERLAY
========================= */

.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,.55)
        );

    pointer-events:none;

}


/* =========================
   GOLD LIGHT
========================= */

.light{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,210,120,.20),
            transparent 65%
        );

    animation:
        lightMove 8s ease-in-out infinite alternate;

}

.light.one{
    top:-200px;
    left:-150px;
}

.light.two{
    bottom:-250px;
    right:-150px;

    animation-delay:3s;
}

@keyframes lightMove{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(80px,50px) scale(1.2);
    }

}


/* =========================
   NAVBAR
========================= */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    padding:18px 6%;

    display:flex;

    justify-content:space-between;
    align-items:center;

    z-index:1000;

    background:
        linear-gradient(
            rgba(42,24,13,.96),
            rgba(42,24,13,.88)
        );

    border-bottom:1px solid rgba(224,180,91,.25);

    backdrop-filter:blur(10px);

}


/* LOGO */

.logo{

    text-decoration:none;

    color:#f2cc7a;

    font-size:25px;

    font-weight:bold;

    letter-spacing:2px;

    transition:.3s;
}

.logo:hover{

    color:#fff0b8;

    text-shadow:
        0 0 15px #e7bd65;

    transform:translateY(-2px);

}


/* NAV */

.nav-right{

    display:flex;

    align-items:center;

    gap:28px;

}

.nav-right a{

    color:#fff;

    text-decoration:none;

    font-size:16px;

    transition:.3s;

}

.nav-right a:hover{

    color:#f3ca75;

}


/* =========================
   HERO CONTENT
========================= */

.hero-content{

    position:relative;

    z-index:5;

    max-width:1000px;

    padding:40px;

}


/* TOP LABEL */

.eyebrow{

    color:#f3cd7b;

    font-size:18px;

    letter-spacing:6px;

    margin-bottom:22px;

    animation:
        fadeDown 1.2s ease forwards;

}


/* TITLE */

.hero h1{

    font-size:
        clamp(65px,10vw,125px);

    line-height:1;

    letter-spacing:5px;

    color:#fff;

    text-shadow:
        0 5px 25px rgba(0,0,0,.8);

    animation:
        titleAppear 1.5s ease forwards;

}


/* THAI TITLE */

.hero h2{

    margin-top:20px;

    font-size:
        clamp(27px,4vw,48px);

    color:#f1ca79;

    font-weight:normal;

    animation:
        fadeUp 1.5s ease .3s both;

}


/* DESCRIPTION */

.hero p{

    max-width:750px;

    margin:25px auto 0;

    font-size:19px;

    line-height:2;

    color:#f5ead5;

    animation:
        fadeUp 1.5s ease .6s both;

}


/* =========================
   BUTTON
========================= */

.enter-button{

    display:inline-flex;

    align-items:center;

    gap:10px;

    margin-top:38px;

    padding:15px 38px;

    border-radius:50px;

    text-decoration:none;

    color:#3b2416;

    background:
        linear-gradient(
            135deg,
            #eac574,
            #c78b38
        );

    font-size:17px;

    font-weight:bold;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:.4s;

    animation:
        fadeUp 1.5s ease .9s both,
        buttonFloat 3s ease-in-out 2.5s infinite;

}

.enter-button:hover{

    transform:translateY(-5px) scale(1.03);

    box-shadow:
        0 15px 40px rgba(225,178,77,.35);

}

@keyframes buttonFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* =========================
   DECORATIVE LINE
========================= */

.decor{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    margin-top:35px;

    opacity:.8;

}

.decor span{

    display:block;

    height:1px;

    width:100px;

    background:#d5ad62;

}

.decor b{

    color:#e7bf6e;

    font-size:22px;

}


/* =========================
   FLOATING DUST
========================= */

.dust{

    position:absolute;

    width:5px;
    height:5px;

    background:#f4d38a;

    border-radius:50%;

    opacity:.6;

    animation:
        dustFloat 7s linear infinite;

}

.d1{
    left:12%;
    bottom:-10px;
    animation-delay:0s;
}

.d2{
    left:28%;
    bottom:-20px;
    animation-delay:2s;
}

.d3{
    left:55%;
    bottom:-15px;
    animation-delay:4s;
}

.d4{
    left:75%;
    bottom:-20px;
    animation-delay:1s;
}

.d5{
    left:90%;
    bottom:-10px;
    animation-delay:3s;
}

@keyframes dustFloat{

    0%{
        transform:translateY(0) translateX(0);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.5;
    }

    100%{
        transform:
            translateY(-100vh)
            translateX(80px);

        opacity:0;
    }

}


/* =========================
   BOTTOM
========================= */

.bottom{

    position:absolute;

    bottom:25px;

    left:0;

    width:100%;

    text-align:center;

    color:#d8bd8c;

    font-size:13px;

    letter-spacing:2px;

    z-index:5;

    animation:
        bottomPulse 3s ease-in-out infinite;

}

@keyframes bottomPulse{

    0%,100%{
        opacity:.5;
    }

    50%{
        opacity:1;
    }

}


/* =========================
   ANIMATIONS
========================= */

@keyframes titleAppear{

    from{
        opacity:0;
        transform:
            translateY(40px)
            scale(.95);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes fadeDown{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{
        padding:15px 5%;
    }

    .nav-right{
        display:none;
    }

    .hero-content{
        padding:30px 20px;
    }

    .hero p{
        font-size:16px;
    }

    .decor span{
        width:50px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <a href="index.html" class="logo">
        🏛️ AYUTTHAYA
    </a>

    <div class="nav-right">

        <a href="page1.html">
            ประวัติกรุงศรีอยุธยา
        </a>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">


    <!-- แสงตกแต่ง -->

    <div class="light one"></div>

    <div class="light two"></div>


    <!-- ฝุ่น/ประกายลอยวน -->

    <div class="dust d1"></div>
    <div class="dust d2"></div>
    <div class="dust d3"></div>
    <div class="dust d4"></div>
    <div class="dust d5"></div>


    <div class="hero-content">


        <div class="eyebrow">
            THE HISTORICAL CITY
        </div>


        <h1>
            AYUTTHAYA
        </h1>


        <h2>
            กรุงศรีอยุธยา
        </h2>


        <div class="decor">

            <span></span>

            <b>✦</b>

            <span></span>

        </div>


        <p>

            เมืองหลวงแห่งความรุ่งเรือง
            <br>

            ร่องรอยแห่งประวัติศาสตร์
            วัฒนธรรม และวิถีชีวิต
            ที่ยังคงเล่าเรื่องราวจากอดีต
            สู่คนรุ่นปัจจุบัน

        </p>


        <a
            href="page1.html"
            class="enter-button"
        >

            เริ่มสำรวจกรุงศรีอยุธยา

            <span>→</span>

        </a>


    </div>


    <div class="bottom">

        SCROLL • EXPLORE • DISCOVER

    </div>


</section>


</body>
</html>
