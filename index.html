<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYUTTHAYA | กรุงศรีอยุธยา</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Kanit',sans-serif;
    background:#170d08;
    color:white;
    overflow-x:hidden;
}

/* ================= NAV ================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:82px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:linear-gradient(
        180deg,
        rgba(15,8,4,.92),
        rgba(15,8,4,.35)
    );

    border-bottom:1px solid rgba(232,190,103,.25);
    backdrop-filter:blur(12px);
}

.logo{
    color:#f4ce7a;
    text-decoration:none;
    font-family:'Playfair Display',serif;
    font-size:25px;
    letter-spacing:3px;
    font-weight:700;
    transition:.4s;
}

.logo:hover{
    color:#fff1bb;
    text-shadow:0 0 25px #e8bd65;
}

.nav-link{
    color:#f7ead2;
    text-decoration:none;
    font-size:15px;
    padding:9px 18px;
    border:1px solid rgba(240,203,125,.45);
    border-radius:30px;
    transition:.4s;
}

.nav-link:hover{
    background:#c99743;
    color:#24140b;
    box-shadow:0 0 25px rgba(221,173,76,.4);
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(20,10,5,.25),
            rgba(20,10,5,.85)
        ),
        url("images/Ayutthaya_Historical_Park_1.jpg")
        center/cover no-repeat;

    animation:zoom 20s ease-in-out infinite alternate;
}

@keyframes zoom{
    from{
        background-size:100%;
    }
    to{
        background-size:112%;
    }
}

/* golden vignette */

.hero::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.7) 90%
        );
}

/* gold glow */

.hero::after{
    content:"";
    position:absolute;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(246,205,111,.18),
            transparent 68%
        );

    animation:glow 8s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        transform:translate(-260px,-100px);
    }
    to{
        transform:translate(260px,100px);
    }
}

/* ================= CONTENT ================= */

.hero-content{
    position:relative;
    z-index:5;
    max-width:1100px;
    padding:30px;
}

.kicker{
    color:#eac16d;
    letter-spacing:8px;
    font-size:15px;

    animation:appear 1.2s ease both;
}

.title{
    font-family:'Playfair Display',serif;

    font-size:clamp(70px,12vw,155px);

    line-height:.95;

    letter-spacing:7px;

    margin:15px 0;

    color:#fffaf0;

    text-shadow:
        0 8px 40px rgba(0,0,0,.9);

    animation:titleIn 1.5s ease both;
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(50px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.thai-title{
    font-size:clamp(30px,5vw,55px);
    color:#efc978;
    font-weight:300;

    animation:appear 1.6s .3s ease both;
}

.line{
    width:180px;
    height:1px;

    margin:25px auto;

    background:linear-gradient(
        90deg,
        transparent,
        #e7bd68,
        transparent
    );

    position:relative;
}

.line::after{
    content:"✦";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    background:#24140b;
    padding:0 12px;

    color:#e8bd69;
}

.description{
    max-width:720px;
    margin:0 auto;

    color:#eadcc5;

    font-size:18px;
    line-height:2;

    animation:appear 1.6s .6s ease both;
}

.enter{
    display:inline-flex;
    align-items:center;
    gap:15px;

    margin-top:35px;

    padding:16px 35px;

    text-decoration:none;

    color:#2b170b;

    background:linear-gradient(
        135deg,
        #f1d185,
        #b77a2d
    );

    border-radius:50px;

    font-size:17px;
    font-weight:500;

    box-shadow:
        0 12px 40px rgba(0,0,0,.45);

    transition:.4s;

    animation:
        appear 1.6s .9s ease both,
        floating 3s 2s ease-in-out infinite;
}

.enter:hover{
    transform:translateY(-7px) scale(1.04);

    box-shadow:
        0 18px 50px rgba(224,174,76,.4);
}

@keyframes floating{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-7px);
    }
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= FLOATING PARTICLES ================= */

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#f1cc7a;

    box-shadow:0 0 12px #f1cc7a;

    opacity:.6;

    animation:particle 8s linear infinite;
}

.p1{left:8%;bottom:-10px;animation-delay:0s}
.p2{left:20%;bottom:-20px;animation-delay:2s}
.p3{left:37%;bottom:-10px;animation-delay:4s}
.p4{left:58%;bottom:-20px;animation-delay:1s}
.p5{left:73%;bottom:-10px;animation-delay:5s}
.p6{left:88%;bottom:-20px;animation-delay:3s}

@keyframes particle{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    100%{
        transform:translateY(-105vh) translateX(100px);
        opacity:0;
    }
}

/* ================= CORNER FRAME ================= */

.corner{
    position:absolute;
    width:100px;
    height:100px;
    z-index:4;
    opacity:.6;
}

.corner::before,
.corner::after{
    content:"";
    position:absolute;
    background:#d9ad5d;
}

.corner::before{
    width:100%;
    height:1px;
}

.corner::after{
    width:1px;
    height:100%;
}

.top-left{
    top:110px;
    left:35px;
}

.top-right{
    top:110px;
    right:35px;
    transform:rotate(90deg);
}

.bottom-left{
    bottom:45px;
    left:35px;
    transform:rotate(-90deg);
}

.bottom-right{
    bottom:45px;
    right:35px;
    transform:rotate(180deg);
}

.scroll{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    color:#dbc391;
    font-size:12px;
    letter-spacing:4px;

    z-index:5;

    animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{opacity:.4}
    50%{opacity:1}
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    nav{
        height:70px;
        padding:0 5%;
    }

    .logo{
        font-size:19px;
    }

    .nav-link{
        font-size:13px;
        padding:7px 13px;
    }

    .description{
        font-size:15px;
    }

    .corner{
        display:none;
    }
}

</style>
</head>

<body>

<nav>

    <a href="index.html" class="logo">
        🏛 AYUTTHAYA
    </a>

    <a href="page1.html" class="nav-link">
        สำรวจประวัติศาสตร์ →
    </a>

</nav>


<section class="hero">

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>


    <div class="hero-content">

        <div class="kicker">
            THE HISTORICAL CITY
        </div>

        <div class="title">
            AYUTTHAYA
        </div>

        <div class="thai-title">
            กรุงศรีอยุธยา
        </div>

        <div class="line"></div>

        <p class="description">
            เมืองหลวงแห่งความรุ่งเรือง
            ศูนย์กลางแห่งการเมือง การค้า ศาสนา
            และวัฒนธรรมของสยาม
            <br>
            จากเรื่องราวในอดีต สู่มรดกทางวัฒนธรรม
            ที่ยังคงอยู่จนถึงปัจจุบัน
        </p>

        <a href="page1.html" class="enter">
            เริ่มต้นการเดินทาง
            <span>✦</span>
        </a>

    </div>

    <div class="scroll">
        SCROLL TO EXPLORE
    </div>

</section>

</body>
</html>
